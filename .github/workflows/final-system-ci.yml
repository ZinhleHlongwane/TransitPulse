name: Final System CI

on:
  push:
    branches: [main]
    paths:
      - "final-system/**"
      - ".github/workflows/final-system-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "final-system/**"
      - ".github/workflows/final-system-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: final-system/pom.xml

      - name: Compile final system
        working-directory: final-system
        run: mvn --batch-mode --no-transfer-progress clean verify
